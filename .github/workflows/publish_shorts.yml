name: Automated Finance Shorts 24/7 Cloud Publisher

on:
  schedule:
    # 09:00 AM IST = 03:30 UTC
    - cron: '30 3 * * *'
    # 03:00 PM IST = 09:30 UTC
    - cron: '30 9 * * *'
    # 08:00 PM IST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  publish-short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publish Next Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISHING_MODE: 'production'
        run: |
          python main.py publish-next

      - name: Commit & Push Updated Schedule / Database
        if: always()
        run: |
          git config --global user.name "FinanceShorts Bot"
          git config --global user.email "bot@financeshorts.local"
          git add data/publishing_schedule.xlsx data/finance_shorts.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(schedule): auto-publish updated schedule [skip ci]" && git push)

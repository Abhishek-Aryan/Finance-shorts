name: Publish Finance Shorts

# ─────────────────────────────────────────────────────────────────────────────
# 24/7 Autonomous YouTube Shorts Publishing Workflow
# Notes:
# - GitHub cron is UTC only (03:30, 09:30, 14:30 UTC = 09:00, 15:00, 20:00 IST).
# - Scheduled runs execute on the default branch only.
# - Scheduled workflows can start slightly late under GitHub Actions platform load.
# - A public repository's scheduled workflows are disabled after 60 days without
#   repo activity; the automated state commits back to the repo keep it active.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 3 * * *'    # 09:00 IST (03:30 UTC)
    - cron: '30 9 * * *'    # 15:00 IST (09:30 UTC)
    - cron: '30 14 * * *'   # 20:00 IST (14:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'test or production'
        type: choice
        options: [test, production]
        default: test
      dry_run:
        description: 'Skip rendering and upload'
        type: boolean
        default: true
      force_privacy:
        description: 'Override privacy'
        type: choice
        options: ['', unlisted, public, private]
        default: ''

concurrency:
  group: finance-shorts-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Gate check publishing mode and pause switch
      - name: Gate Check Publishing Mode and Pause Switch
        id: gate
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="production"
            DRY_RUN="false"
            FORCE_PRIVACY=""
          else
            MODE="${{ inputs.mode }}"
            DRY_RUN="${{ inputs.dry_run }}"
            FORCE_PRIVACY="${{ inputs.force_privacy }}"
          fi
          echo "MODE=${MODE}" >> "$GITHUB_ENV"
          echo "DRY_RUN=${DRY_RUN}" >> "$GITHUB_ENV"
          echo "FORCE_PRIVACY=${FORCE_PRIVACY}" >> "$GITHUB_ENV"

          if [ "${MODE}" = "production" ]; then
            if [ "${PUBLISH_ENABLED:-false}" != "true" ]; then
              echo "Publishing paused"
              echo "PAUSED=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "PAUSED=false" >> "$GITHUB_ENV"

      # Step 2: Checkout repository with full history
      # Note: Pin to major tag v4 (SHA pinning recommended for enterprise security)
      - name: Checkout Repository
        if: env.PAUSED != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Step 3: Setup Python 3.11 with pip cache
      # Note: Pin to major tag v5 (SHA pinning recommended for enterprise security)
      - name: Set up Python 3.11
        if: env.PAUSED != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # Step 4: Install system packages
      - name: Install System Packages
        if: env.PAUSED != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -version | head -1

      # Step 5: Install Python dependencies
      - name: Install Dependencies
        if: env.PAUSED != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 6: Preflight environment and health check
      - name: Run Preflight Check
        if: env.PAUSED != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python tools/preflight.py --mode "${MODE}"

      # Step 7: Materialize credentials securely from environment
      - name: Materialize Credentials
        if: env.PAUSED != 'true'
        env:
          SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          mkdir -p config
          if [ -n "${SECRETS_JSON}" ]; then
            printf '%s' "${SECRETS_JSON}" > config/youtube_client_secrets.json
            chmod 600 config/youtube_client_secrets.json
            python -c "import json, sys; json.load(open(sys.argv[1]))" config/youtube_client_secrets.json
          fi
          if [ -n "${TOKEN_JSON}" ]; then
            printf '%s' "${TOKEN_JSON}" > config/youtube_token.json
            chmod 600 config/youtube_token.json
            python -c "import json, sys; json.load(open(sys.argv[1]))" config/youtube_token.json
          fi

      # Step 8: Validate YouTube OAuth token health in production mode
      - name: Check YouTube Token Health
        if: env.PAUSED != 'true' && env.MODE == 'production'
        run: |
          set -euo pipefail
          python tools/check_youtube_token.py

      # Step 9: Run publish-next pipeline
      - name: Publish Next Topic
        if: env.PAUSED != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          PUBLISHING_MODE: ${{ env.MODE }}
        run: |
          set -euo pipefail
          mkdir -p logs
          LOG_FILE="logs/run_$(date +%Y%m%d_%H%M).log"
          echo "RUN_LOG=${LOG_FILE}" >> "$GITHUB_ENV"

          CMD="python main.py publish-next"
          if [ "${DRY_RUN}" = "true" ]; then
            CMD="${CMD} --dry-run"
          fi
          if [ -n "${FORCE_PRIVACY}" ]; then
            CMD="${CMD} --force-privacy ${FORCE_PRIVACY}"
          fi

          set +e
          $CMD 2>&1 | tee "${LOG_FILE}"
          EXIT_CODE="${PIPESTATUS[0]}"
          echo "EXIT_CODE=${EXIT_CODE}" >> "$GITHUB_ENV"
          set -e

      # Step 10: Persist updated schedule and state atomically back to Git
      - name: Persist Schedule State
        if: always() && env.PAUSED != 'true' && env.EXIT_CODE != ''
        run: |
          set -euo pipefail
          # Verify no secrets in config/ are staged or tracked
          STAGED_CONFIG=$(git status --porcelain config/ || true)
          if [ -n "${STAGED_CONFIG}" ]; then
            echo "ERROR: Files under config/ detected! Discarding to avoid leaking credentials." >&2
            git checkout -- config/ || true
            exit 1
          fi

          SLOT=$(date +"%H:%M_IST")
          BRANCH="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/publishing_schedule.xlsx data/schedule_state.json

          # Strict security verification: ensure no config files were staged
          if git diff --staged --name-only | grep -E '^config/'; then
            echo "ERROR: config/ file detected in staged changes! Aborting commit." >&2
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "No changes in schedule or state to commit."
          else
            git commit -m "chore(schedule): ${SLOT} run exit=${EXIT_CODE} [skip ci]"
            for attempt in 1 2 3; do
              echo "Push attempt ${attempt}..."
              if git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}"; then
                echo "Successfully pushed state to ${BRANCH}."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push state after 3 attempts." >&2
                exit 1
              fi
              sleep 10
            done
          fi

      # Step 11: Scrub materialized credentials from disk
      - name: Clean Up Credentials
        if: always() && env.PAUSED != 'true'
        run: |
          set -euo pipefail
          rm -f config/youtube_client_secrets.json config/youtube_token.json

      # Step 12: Upload execution logs as artifacts
      # Note: Pin to major tag v4 (SHA pinning recommended for enterprise security)
      - name: Upload Run Logs
        if: always() && env.PAUSED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

      # Step 13: Interpret exit code contract and fail job appropriately
      - name: Interpret Exit Code
        if: always() && env.PAUSED != 'true'
        run: |
          set -euo pipefail
          CODE="${EXIT_CODE:-0}"
          echo "Evaluating exit code: ${CODE}"
          case "${CODE}" in
            0)
              echo "Exit code 0: OK or nothing currently due."
              ;;
            4)
              echo "::warning::Exit code 4: Published to YouTube, but Excel view is stale."
              ;;
            1)
              echo "::error::Exit code 1: Pipeline failure during generation, rendering, or upload."
              exit 1
              ;;
            2)
              echo "::error::Exit code 2: Configuration or credential error (API keys / YouTube token)."
              exit 2
              ;;
            3)
              echo "::error::Exit code 3: State conflict between Excel and schedule state store."
              exit 3
              ;;
            *)
              echo "::error::Unexpected exit code: ${CODE}"
              exit "${CODE}"
              ;;
          esac

      # Step 14: Create or update GitHub issue alert on failure
      - name: Failure Alert
        if: always() && env.PAUSED != 'true' && (failure() || (env.EXIT_CODE != '0' && env.EXIT_CODE != '4'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLOT_VAL=$(date +"%H:%M IST")
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python tools/format_alert.py \
            --exit-code "${EXIT_CODE:-1}" \
            --run-url "${RUN_URL}" \
            --log-path "${RUN_LOG:-}" \
            --slot "${SLOT_VAL}" \
            --out-title alert_title.txt \
            --out-body alert_body.txt

          TITLE=$(cat alert_title.txt)
          EXISTING_ISSUE=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing alert issue #${EXISTING_ISSUE}..."
            gh issue comment "$EXISTING_ISSUE" --body-file alert_body.txt
          else
            echo "Opening new alert issue..."
            gh issue create --title "$TITLE" --body-file alert_body.txt
          fi

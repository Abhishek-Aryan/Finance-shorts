name: Schedule Watchdog

# Runs every 15 minutes at off-peak minutes (10, 25, 40, 55) to verify that scheduled runs
# were not dropped or queued by GitHub Actions cron congestion.
# If any topic is >15 minutes overdue and still Pending, files an alert issue and immediately
# triggers Publish Finance Shorts via workflow_dispatch to self-heal and publish without delay.

on:
  schedule:
    # Run every 15 minutes at off-peak minutes (avoids :00 and :30 queue congestion)
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: finance-shorts-watchdog
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: '1'

jobs:
  check-overdue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          pip install openpyxl pytz python-dotenv

      - name: Run Overdue Schedule Check
        id: check
        run: |
          set -euo pipefail
          set +e
          python tools/watchdog.py --threshold-hours 0.25 --out-title watchdog_title.txt --out-body watchdog_body.txt
          CHECK_CODE=$?
          echo "CHECK_CODE=${CHECK_CODE}" >> "$GITHUB_ENV"
          set -e

      - name: Alert and Auto-Recover Overdue Topics
        if: env.CHECK_CODE != '0' && env.CHECK_CODE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s watchdog_title.txt ]; then
            TITLE=$(cat watchdog_title.txt)
            EXISTING_ISSUE=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
              echo "Updating existing watchdog issue #${EXISTING_ISSUE}..."
              gh issue comment "$EXISTING_ISSUE" --body-file watchdog_body.txt || true
            else
              echo "Opening new watchdog alert issue..."
              gh issue create --title "$TITLE" --body-file watchdog_body.txt || true
            fi
            echo "Auto-triggering Publish Finance Shorts to recover overdue topic..."
            gh workflow run publish_shorts.yml -f mode=production -f dry_run=false -f force_privacy=public || true
          fi
